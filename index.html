<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Test Vercel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 { margin-top: 0; font-size: 2.5rem; }
        p { font-size: 1.1rem; opacity: 0.9; }
        button {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            font-weight: bold;
        }
        button:hover {
            background-color: #d63031;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 Chào Vercel!</h1>
        <p>Trang web test của tôi đang chạy cực kỳ mượt mà.</p>
        <button onclick="showAlert()">Bấm vào đây để test JS</button>
    </div>

    <script>
        function showAlert() {
            alert("Tuyệt vời! JavaScript hoạt động hoàn hảo trên Vercel!");
        }
    </script>

</body>
</html>
